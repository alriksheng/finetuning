# 2026-10-27（二）：并入专家规则后新增 R-BASIC-BASIS、R-BASIC-MGMT（basic）、R-POL-SHARE（pol_share），新增章节类型 purchase（购买服务立项必要性论证）、orgmgmt（组织管理情况）。
# 2026-10-27：所有章节、比对包的审核重点都加入 R-COST-CHECK（成本数据一致性）——文字与表格、不同表之间的数据不一致可能出现在任何章节，此前在没有该规则的章节里专家只能借用相近规则标注。修改前的版本见 focus_map_v1.yaml。
# 章节 / 比对包 → 审核重点 对应表：训练和线上共用，按报告切分得到的 kind 选规则，放入输入的【审核重点】。
# 审核重点是本小节应检查的方面，不等于一定有问题；专家意见用到的规则必须在本小节的审核重点中（build.py 核验）。
# 按项目类型分三套，与 clause_map.yaml 对应；摘要小节（abs_xxx）沿用对应正文小节。
# L3-07（指标与成本关联）：专家第六轮确认口径后加入 perf / pol_perf（2026-10-15），普通样本按标准第十节 6a 补意见。
