weights:                   # 3.2 第 3 条：精标样本复制倍数；抽查显示自动标注错误率偏高时降低其权重
  精标: 2
  自动标注: 1
thinking: [think, nothink] # 3.2 第 5 条：带推理过程、不带推理过程两个版本，用开发集选择
include_candidates: false  # 未经专家确认的候选样本不进训练集
rules:                     # 2.12：规则专项样本
  L3-07:
    in_train: true         # 专家第六轮已确认口径（2026-10-15），专项样本进入训练（上下文蒸馏）
    train_variant: tag     # 上下文蒸馏：训练输入只带规则标签
synthetic_cap: 0.30        # 2.6：合成样本合计不超过训练集的 30%
rule_ratio: 0.5            # 专项样本行数 = 普通样本（含精标加权）的 0.5 倍，即普通 : 专项 = 2 : 1（用户 2026-10-23）；按专项分类平均挑选（汇总、合成、驱动成本、不适用、无对应成本项、需人工核对）
rule_seed: 20261023        # 类内项目轮流顺序的随机种子
keep_na_per_project: 2     # 每个项目保留的“不适用”逐项判断条数（防误报用，重复多了价值不大）
