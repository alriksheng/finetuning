# 规则卡 L3-07 指标与成本挂钩（方案 v4 2.12 第 1 步）
# 判断依据：data/rules/指标到成本计算规则.md（沪财绩〔2024〕15号、〔2025〕8号）；与本卡口径不一致处见该文件第五节，待专家确认。
# 状态：草稿，待业务专家确认。专家确认前，据此生成的专项样本只作“规则卡生成、脚本核验”的候选，不作为已确认样本。
rule_id: L3-07
title: 指标与成本挂钩
tag: 指标与成本关联          # 规则标签，须与 rules.yaml 的 tag 一致；上线及上下文蒸馏训练时，输入中只放“【审核重点】指标与成本关联（L3-07）”这一行
status: 专家第六轮已确认口径（2026-10-15）

caliber: >-
  关键绩效指标应当是成本动因：指标值变化，某一成本项的用量或金额随之变化。
  能说出“指标提高（降低）→ 哪个成本项的数量或单价增加（减少）”的，判为挂钩；说不出的，判为无对应成本项。

scope:
  applies: 产出数量、质量、时效指标，以及从中提炼的关键绩效指标；报告列为效益、实质是过程质量要求的（如环保施工达标率）按质量指标判断（2026-10-16 按政策统一；第六轮曾把社会知晓率等效益比率也列为适用）
  not_applicable: 其余社会效益、生态效益、可持续影响、满意度类指标。这类指标本来就不直接驱动成本，输出“不适用”，不判为问题；成本指标本身（如投资控制）也不适用
  open_questions:                       # 待定口径；decision 为专家确认结果（第六轮）；match 用于在确认表中列出受影响的逐项判断
    - id: Q1
      question: 产出时效指标（如 P001 抢修 2 小时到场）是否纳入适用范围
      draft: 暂按“适用”处理：有明确时限的（如 2 小时到场）判为驱动成本，因为时效要求决定值守人员配置；只写“及时”的判为无对应成本项
      match: {category: [产出时效]}
      decision: 改为其他口径：只写“及时”、没有量化时限的，判为“需人工核对”（无量化表述）；有明确时限的判为驱动成本
    - id: Q2
      question: 完成率类指标（如 P002 考务组织工作完成率 100%）是否一律判为“无对应成本项”
      draft: 一律判为无对应成本项：完成率反映有没有完成，不反映做了多少
      match: {indicator_contains: [完成率]}
      decision: 第六轮专家改为“按完成程度驱动成本”；2026-10-16 按沪财绩〔2025〕8号、〔2024〕15号统一为：完成率经由完成数（作业数量）驱动成本，判为驱动成本，须写出背后的作业数量；指标表缺该数量指标的，汇总中建议补充
    - id: Q3
      question: 合格率类质量指标（如 P001 养护考核合格率）是否算成本动因
      draft: 判为无对应成本项：反映考核或验收结果，不改变资源用量
      match: {indicator_contains: [合格率, 达标率], category: [产出质量, 质量指标]}
      decision: 第六轮专家改为“按达标程度驱动成本”；2026-10-16 按 15 号文“质量指标应与成本指标相匹配”、8 号文“单位作业配比”统一为：合格率、达标率是质量指标，经由达标所需的配置或执行标准（配比因子、单价因子）驱动成本，须写出对应的配置或标准
    - id: Q4
      question: 完好率类质量指标（如 P003 场地设施设备完好率 100%）是否算成本动因
      draft: 判为驱动成本（影响维修和更新费用），与方案 v4 体育设施例子一致，但与合格率类的处理不同
      match: {indicator_contains: [完好率]}
      decision: 同意草稿
    - id: Q5
      question: 成本指标本身（如 P004 投资控制“按批准概算控制”）如何处理
      draft: 判为不适用：它本身是成本约束，不是成本动因
      match: {category: [成本指标]}
      decision: 同意草稿
    - id: Q6
      question: 政策项目以“支持方向及扶持标准”作为成本构成表（P005），只计个数的数量指标判为驱动成本是否合适
      draft: 判为驱动成本，并在汇总中指出指标只计个数、反映不了按投资额比例计算的扶持资金规模
      match: {project: [P005], judgment: [驱动成本]}
      decision: 同意草稿
    - id: Q7
      question: 排放标准、种植导则等“执行标准”类质量指标（P003 出水水质、P004 植物种植）是否算成本动因
      draft: 判为驱动成本：执行的标准决定工艺或苗木规格，从而影响单价
      match: {indicator_contains: [出水水质, 植物种植]}
      decision: 同意草稿
    - id: Q8
      question: 常规性项目管理要求类指标（如季度考核完成率、项目审核及时率、资金发放完成率、补助发放准确性）怎么判
      draft: 第六轮前三条判为驱动成本
      match: {indicator_contains: [季度考核完成率, 项目审核及时率, 资金发放完成率, 补助发放准确性]}
      decision: 2026-10-16 按沪财绩〔2024〕15号“不应设置如常规性的项目管理要求等与产出、效益和成本明显无关联的指标”，判为无对应成本项，注明属于常规性管理要求类指标，建议替换为作业数量类指标（用户确认按政策执行）
    - id: Q9
      question: 考核、验收“通过”类的合格率、达标率（如成果验收合格率、考核得分达标率、报告合格率）与“达标所需配置或标准”类的合格率（如养护考核合格率、设施设备验收合格率）怎么区分
      draft: 现行口径：考核、检查“通过”类的先按常规性项目管理要求判为无对应成本项；能写出达标所需的人员、设备配置或须执行的工艺标准的，判为驱动成本（配比或单价因子）。P006–P057 新批次按此执行，但 P001、P005、P006、P007 中已采纳的“验收合格率”“考核合格率”判为驱动成本，两类做法并存，请专家划定界线
      match: {indicator_contains: [合格率, 达标率, 通过率]}
      decision: 2026-10-19 按沪财绩〔2024〕15号“质量指标应与效益指标、成本指标相匹配”（示例“工程竣工验收合格率”“验收合格率”）和〔2025〕8号“单位作业配比”统一：产出对象为工程、设施设备、印刷出版物等实体成果的验收合格率、达标率，属于质量指标，判为驱动成本（配比因子或单价因子），须写出达标所需的质量标准或配置及对应成本项；考核、检查、评审得分“通过”类，以及报告、课题等文档成果的验收通过率，属于常规性项目管理要求，判为无对应成本项。界线按被验收的对象划分，不按指标名称中是否有“考核”“验收”划分
    - id: Q10
      question: 及时率类指标：报告或资料提交、检查验收、活动举办类的“及时”，与服务本身的响应或完成时效如何区分
      draft: 报告提交、审核、检查、活动按时类判为无对应成本项（管理要求类）；服务本身的完成时效只写“及时”的判为需人工核对；写明时限（如 24 小时）的判为驱动成本（时间因子）
      match: {indicator_contains: [及时]}
      decision: 2026-10-19 按沪财绩〔2024〕15号“设置时效指标，需确定整体完成时间……关键性时间节点……按周期或频次设定”和“避免选用标准不明确或缺乏约束力的指标”统一，按计时对象划分：审核、报告和资料提交、检查、验收、考核、结项等管理动作的“及时”，属于常规性管理要求，判为无对应成本项；服务、作业、工程本身的完成或响应时效（含开竣工、决算、应急处置、出版推送、维修、活动和培训的开展），只写“及时”“及时率”“及时性”而无时限的，判为需人工核对，并给出量化方向；写明时限、周期或频次的，判为驱动成本（频次因子或配置因子）。不按指标名称是“率”还是“性”划分
    - id: Q11
      question: 保险、风险类指标（报案率、理赔率、采样成功率）能否作为“单价因子”判为驱动成本
      draft: 判为驱动成本（单价因子）：保险理赔率、报案率影响承保报价，采样成功率决定巡检组配置；须写出对应的理赔要求或配置。活动“举办成功率”类按管理要求判为无对应成本项
      match: {indicator_contains: [理赔率, 报案率, 成功率]}
      decision: 2026-10-19 按沪财绩〔2024〕15号质量指标“反映预期提供的公共产品或服务达到的标准和水平”和〔2025〕8号“单位作业配比”统一，同意草稿：保险理赔率、报案率体现合同约定的服务标准，影响承保报价，判为驱动成本（单价因子）；采样成功率决定采样作业配置，判为驱动成本（配比因子）；须写出对应的服务要求或配置，成本表无对应费用项的写“成本构成表未列”。活动“举办成功率”按常规性管理要求判为无对应成本项
    - id: Q12
      question: 完成率类指标中的“项目按时完成率”“数据收集完成率”等过程性完成率，是否仍按“经由完成数驱动成本”处理
      draft: 能对应到具体作业数量的完成率（培训人次、检查企业数、图书种数）判为驱动成本；表示项目整体进度、数据收集、资金发放的过程性完成率判为无对应成本项
      match: {indicator_contains: [完成率, 完成进度]}
      decision: 2026-10-19 按沪财绩〔2025〕8号数量指标“作业完成数”统一，同意草稿并补一条检验：分子是作业对象（培训人次、检查企业数、维修设备数、图书种数、考试场次）且成本表有按该对象计价的成本项的，判为驱动成本（经由完成数的数量因子）；表示项目整体进度、资金发放、数据收集等管理过程的完成率，判为无对应成本项；“项目按时完成率”等整体进度类，按时效指标处理（见 Q10）
    - id: Q13
      question: 效益或成果类产出指标（优秀节目数量、全网传播量、征集完成率）与间接相关成本项（表演嘉宾费、新媒体宣传推广费、评选专家费）的关联，是否算“硬性凑数”
      draft: 判为驱动成本，但在理由中写明关联较弱、成本表按“项”或总额列示，要求补充数量与单价；若专家认为不成立，则改判为不适用
      match: {indicator_contains: [优秀项目数量, 全网传播量, 节目征集完成率]}
      decision: 2026-10-19 按沪财绩〔2025〕8号“预期效益－预期产出－预期成本”的路径统一，同意草稿：列为产出指标的成果数量（优秀项目数量）、征集完成率判为驱动成本；传播量等触达类指标在报告列为产出时，经由推广篇数、频次影响推广费，判为驱动成本，理由中写明关联较弱、成本表按“项”或总额列示，建议补充数量与单价；报告列为效益指标的传播量类，按效益类判为不适用
    - id: Q14
      question: 管理要求类指标在专家意见中的处理方式：模型写“替换为作业数量类指标”，专家（如 P057）写“删除非关键指标”
      draft: 保持“无对应成本项，建议替换为作业数量类指标”；若指标本身不属于关键绩效指标，则可建议删除。请专家说明何时替换、何时删除
      match: {indicator_contains: [数据收集完成率, 工作完成进度, 按时上报资金使用情况]}
      decision: 2026-10-19 按沪财绩〔2024〕15号“应选取能体现项目主要产出和核心效果的指标，突出重点”和“不应设置如常规性的项目管理要求等……明显无关联的指标”统一：管理要求类指标所对应的工作内容，在指标表中已有作业数量类指标覆盖的，建议删除；尚无作业数量类指标覆盖的，建议替换为作业数量类指标。专项样本沿用“替换”的写法，不再区分
steps:
  - 1. 判断指标类别：效益、满意度、可持续影响类 → 不适用，结束；其中以比率表示、需投入资源才能提高的效益指标除外，继续第 2 步；成本指标本身 → 不适用
  - 2. 对适用指标，在成本构成表中找受它影响的成本项：指标值提高或降低时，哪个成本项的数量或单价随之变化，方向如何
  - 3. 完成率经由完成数驱动成本，写出背后的作业数量；合格率、达标率、完好率等质量指标经由达标所需的配置或标准驱动成本，写出对应的配置或标准；常规性项目管理要求类指标（考核、审核、资金发放、发放准确性等）判为无对应成本项，并建议替换；只写“及时”等、没有量化表述的 → 需人工核对；确实找不到对应成本项的 → 无对应成本项
  - 3a. 判为驱动成本必须说得清机制：指标值变化 → 哪种资源投入（人员、班次、车辆、材料、频次、单价）变化 → 落到哪个成本项；时效指标对应值守人员、车辆配置和出勤附加费用，不对应工程量；成本表未列的注明“成本构成表未列”，不拿相邻成本项凑数
  - 4. 汇总：列出主要成本项是否都有指标覆盖；列出无对应成本项、需人工核对的关键指标，以及没有任何指标覆盖的主要成本项

output:                                  # 子任务 2（逐个指标）的输出字段
  judgment: 驱动成本 / 无对应成本项 / 需人工核对 / 不适用
  fields: [indicator, category, judgment, cost_items, direction, evidence, reason]
  evidence: 必须是指标表或成本构成表中的原文摘录，由脚本核验

policy_anchor:                           # 已核对政策原文
  - clause_id: P8-T2-3-1-1
    note: 范本2 三（一）1“提炼与成本关联的关键绩效指标”
  - clause_id: P15-2-2-2
    note: “质量指标应细化设置，与效益指标、成本指标相匹配”
  - clause_id: P15-1-2-1
    note: “不应设置如常规性的项目管理要求等与产出、效益和成本明显无关联的指标”
policy_reference_scoped:                 # 方案 v4 列出、但适用范围较窄的依据，不放入样本输入
  - text: 8号文第十一条“统筹考虑项目全生命周期成本”
    note: 原文前提为“对于新增重大项目”，本期两个项目均为经常性项目，不适用
  - text: 8号文成本核算分析“阐明成本动因”
    note: 出自第三章“一类事”项目的成本核算分析要求，单个项目适用范本2，可作参考

examples:                                # 正反例，来自 P001、P002 绩效指标表（待专家确认）
  - {project: P001, indicator: 标线复划覆盖率, category: 产出数量, judgment: 驱动成本, cost_items: [地面复划, 快速路复划, 地面涂料采购], direction: 同向, why: 覆盖率×设施面积=复划面积，复划和涂料用量随之变化}
  - {project: P001, indicator: 巡视里程完成值, category: 产出数量, judgment: 驱动成本, cost_items: [巡视], direction: 同向, why: 巡视费用按里程×单价计算}
  - {project: P001, indicator: 养护考核合格率, category: 产出质量, judgment: 驱动成本, cost_items: [地面复划, 快速路复划, 巡视], direction: 同向, why: 合格率要求越高，复划质量和巡查投入越多（专家第六轮改判）}
  - {project: P001, indicator: 季度考核完成率, category: 产出时效, judgment: 无对应成本项, why: 按时完成季度考核评分属于常规性管理要求，不改变任何作业的数量和单价（按 15 号文统一口径）}
  - {project: P001, indicator: 公众满意度, category: 满意度, judgment: 不适用, why: 满意度类，不直接驱动成本}
  - {project: P001, indicator: 行业示范效应, category: 社会效益, judgment: 不适用, why: 效益类；是否适配项目导向属于另一条规则（R-BASE-INDICATOR）}
  - {project: P002, indicator: 考生出考率, category: 产出质量, judgment: 无对应成本项, why: 考场、监考巡考、试卷按报名缴费考生数准备，与是否到场无关（与专家意见一致）}
  - {project: P002, indicator: 考务组织工作完成率, category: 产出数量, judgment: 驱动成本, cost_items: [劳务费, 委托服务费], direction: 同向, why: 成本经由完成的考试场次进入公式（场次×每场劳务和服务成本）；指标表缺考试场次等数量指标，应补充}
  - {project: P002, indicator: 有责投诉, category: 社会效益, judgment: 不适用, why: 效益类}
  - {project: P003, indicator: 应急处置及时性, category: 产出时效, judgment: 需人工核对, why: 标杆值只写“及时”，未规定时限，需人工核对（专家第六轮口径）}
  - {project: P005, indicator: 社会知晓率, category: 经济效益, judgment: 不适用, why: 效益指标不直接进入成本公式，对应的应是宣传推介作品数等产出指标（2026-10-16 按政策统一）}
  - {project: 合成, indicator: 报名缴费科目数（由“考生出考率”改写）, category: 产出数量, judgment: 驱动成本, cost_items: [委托服务费, 劳务费], direction: 同向, why: 委托服务费按科目数结算，考场数和监考巡考人数随之变化}

risk: 把效益、满意度类指标误判为“无对应成本项”；为了凑覆盖而硬性建立关联（如从抢修及时率推出抢修工程量）；把只写“及时”的指标直接判为驱动成本（应为需人工核对）。测试集中必须包含这类指标，并单独统计其误报率（方案 v4 2.12）。
