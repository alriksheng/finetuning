  brief: 是否明确相关主体的职责分工和职责边界；是否列示供应商信息；涉及采购的，是否介绍需求内容、合同条款、验收与按效付费条件。
- rule_id: R-PURCHASE-NEED
  tag: 购买服务立项必要性
  level: L2
  question: 购买服务项目是否论证立项必要性、规范性和必须通过购买服务完成的理由，是否符合分类管控要求
  judgment_points: 上级政策与部门职责；指导性目录与负面清单；决策过程；岗位编制与必须购买的理由；多项服务逐项论证；分类管控
  policy_anchor: []
  origin: 评审经验（专家智能体规则）
  source_cases: []
  industries: []
  valid_period: 2025-
  status: 已确认（用户 2026-10-27）
  points:
  - point: 购买服务立项必要性
    not_raise: ''
    note: 现有规则中没有对应“购买服务立项必要性论证部分”的规则，拟新增；仅适用于购买服务项目
    source_pids:
    - E030
    - E212
    raise: 购买服务项目只谈业务需要，未结合上级政策依据与部门职责论证项目立项必要性
  - point: 购买服务规范性
    not_raise: ''
    note: 引用政策时应落到本项目的具体品目和事项
    source_pids:
    - E031
    - E213
    - E214
