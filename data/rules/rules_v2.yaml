  brief: 数量是否有业务量依据（作业频次、里程、点位等），是否按新设基线重新确认；人员配置、岗位数量与临时用工是否结合作业量和频次论证；取整十数等估值而无依据的提出。
- rule_id: R-COST-PRICE
  tag: 单价核定依据
  level: L2
  question: 单价核定是否有来源和市场比价，下浮/上调比例是否有依据
  judgment_points: 基准价来源；下浮比例依据；管理费率等比例有出处；不同口径的单价需统一并说明
  policy_anchor:
  - P8-T2-3-3-2
  origin: 政策+评审经验
  source_cases:
  - P001
  - 典型问题汇总
  industries:
  - 交通设施养护
  valid_period: 2025-04-
  status: 待专家确认
  points:
  - point: 单价核定依据
    not_raise: ''
    note: ''
    source_pids:
    - E047
    - E226
    - E227
    raise: 单价缺少市场比价的必要过程，无历史比对；未参照同期政府框架协议采购价等公开可比基准；核定单价高于历史采购价或市场平均水平而未说明原因、未做成本效益分析
  - point: 费率与计提比例
    not_raise: ''
    note: ''
    source_pids:
    - E228
    raise: 综合管理费、税费等计提比例未提供设定理由或参照依据；比例较历史水平上调未说明
  - point: 就低不就高
    not_raise: ''
    note: ''
    source_pids:
    - E056
    - E229
    - E235
    raise: 同一费用项在不同来源给出多个单价标准，未说明取用依据、未按“就低不就高”原则统一；人工单价等核定“一刀切”，未遵循最低成本原则
  - point: 分档分级核定
    not_raise: ''
    note: ''
    source_pids:
    - E057
    - E236
    raise: 用高等级（更高资质、更复杂情形）的单价套用于低等级事项，未分档分级核定
  - point: 购买服务分类核算方法
    not_raise: ''
    note: 依据沪财绩〔2025〕32号成本核算差异口径；仅适用于购买服务项目
    source_pids:
    - E052
    - E117
    - E118
    - E239
    - E240
    raise: 公共服务类购买服务未采用与行业平均水平对比、与历史水平比较、按最优配置取值、作业成本法等多种方法核算合理成本，未明确资源消耗用量与价格；管理辅助、后勤保障、信息技术、工程管理类服务未与不同部门同类事项对比、与历史比较，未优先采用最低成本法核定
  brief: 单价是否有市场比价、历史比对或公开可比基准，高于历史或市场水平是否说明；费率比例是否有依据；同一费用多标准是否就低统一，是否分档分级核定；购买服务是否按类别选用核算方法。
- rule_id: R-COST-CYCLE
  tag: 成本周期性
  level: L4
  question: 成本基线是否考虑周期性（大小年），是否仅以单一年度为基础
  judgment_points: 周期性支出应按完整周期核算；多年数据确定基线
  policy_anchor:
  - P8-8
  origin: 评审经验
  source_cases:
  - P002
  industries:
  - 考试考务
  valid_period: 2025-04-
  status: 待专家确认
  points:
