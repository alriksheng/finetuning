    not_raise: ''
    note: ''
    source_pids:
    - E043
    - E231
    - E049
    raise: 成本归集不合理，未按成本主要动因划分可变成本和不变成本，未区分人员经费和服务经费、自主运营和委托运营；未明确成本核算范围；未剔除已有成本中不合理无效内容，或未说明不合理成本的形成原因及测算优化依据
  - point: 归集口径与合同口径
    not_raise: ''
    note: ''
    source_pids:
