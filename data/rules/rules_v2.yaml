- rule_id: R-SCOPE
  tag: 分析范围完整性
  level: L3
  question: 分析范围是否覆盖实施内容的全部组成部分，范围与成本口径是否一致
  judgment_points: 行业标准/工艺要求规定的必要工序应纳入分析范围；范围与基本情况不一致时需说明原因
  policy_anchor:
  - P8-T2-2-1
  origin: 政策+评审经验
  source_cases:
  - P001
  industries:
  - 交通设施养护
  valid_period: 2025-04-
  status: 待专家确认
  points:
  - point: 项目边界交叉
    not_raise: ''
    note: ''
    source_pids:
    - E249
    raise: 与同类项目工作内容边界交叉重叠而未界定，降本结果缺乏针对性
  brief: 分析范围是否覆盖实施内容全部组成部分，范围与成本口径是否一致；与同类项目工作内容交叉重叠的，是否界定边界。必要工序未纳入或范围与基本情况不一致而未说明的提出。
- rule_id: R-BASIC-BUDGET
  tag: 预算信息完整性
  level: L2
  question: 预算信息是否完整、变化原因和预算构成是否说明
  judgment_points: 近三年预决算；年度变化原因；预算编制依据；经费去向
  policy_anchor:
  - P8-T2-1-3
  origin: 政策
  source_cases:
  - P002
  industries:
  - 考试考务
  valid_period: 2025-04-
  status: 待专家确认
  points:
  - point: 预算信息
    not_raise: 执行率接近满额且预算未调整，属于预算编制准确的正常情形，不作问题提示；高执行率本身不是问题，问题只在偏低或与实际进展矛盾
    note: 删去原文中出自评测项目 P007 的具体数字
    source_pids:
    - E013
    - E176
    raise: 经常性项目未至少列示近三年预决算（应为决算数而非预算数）；未说明预算变更情况及原因；预决算口径不统一；预算执行率明显偏低、逐年异常波动或与项目实际进展矛盾而未说明原因；涉及差额拨款事业单位、多级财政事权、企业公共服务事项的未按全口径阐述
  - point: 年度间预算变动
    not_raise: ''
    note: ''
    source_pids:
    - E017
    - E181
    raise: 预算或执行年度间明显增减，未说明变动原因与必要性；或未列示近三年执行情况以供参照
  - point: 预算编制依据
    not_raise: ''
    note: ''
    source_pids:
    - E018
    - E182
    raise: 未说明预算测算所依据的定额、标准、历史数据或合同价
  brief: 是否列示近三年决算数，预算变动、执行率偏低或与进展矛盾是否说明原因，是否说明预算编制所依据的定额、标准、历史数据或合同价；差额拨款等是否按全口径阐述。不提：执行率接近满额且预算未调整属正常。
- rule_id: R-BASIC-CONTENT
  tag: 实施内容梳理
  level: L2
  question: 实施内容是否梳理到位（体量、服务边界、服务标准、人员/场地安排）
  judgment_points: 与成本关联度高的数量、人员、场地信息应在实施内容中给出；实施内容与资金安排对应
  policy_anchor:
  - P8-T2-1-2
  origin: 政策+评审经验
  source_cases:
  - P001
  - P002
  industries:
  - 交通设施养护
  - 考试考务
  valid_period: 2025-04-
  status: 待专家确认
  points:
  - point: 实施内容梳理
    not_raise: ''
    note: 整改方向：突破现有项目构成，按可变成本与不变成本（或人员经费与服务经费）重新梳理
    source_pids:
    - E012
    - E175
    raise: 实施内容梳理不到位，服务边界、服务内容、服务标准不清晰；或完全按现有一级、二级、三级项目构成拆解实施内容，导致无法开展成本分析
  - point: 实施内容与资金对应
    not_raise: ''
    note: ''
    source_pids:
    - E014
    raise: 实施内容与资金安排未体现关联性
  brief: 实施内容是否梳理到位：服务边界、内容、标准、体量是否清晰，是否突破现有一、二、三级项目构成按成本动因重新梳理，实施内容与资金安排是否对应。
- rule_id: R-BASE-INDICATOR
  tag: 绩效指标聚焦
  level: L4
  question: 绩效指标是否聚焦与成本关联的关键指标，是否与项目核心目标关联
  judgment_points: 受服务对象行为影响、主管部门无法管理的指标不宜作基线；缺少核心效益指标需补充
  policy_anchor:
  - P8-T2-3-1-1
  - P15-1-2-1
  - P8-6
  origin: 政策+评审经验
  source_cases:
  - P001
  - P002
  - 典型问题汇总
  industries:
  - 交通设施养护
  - 考试考务
  valid_period: 2025-04-
  status: 待专家确认
  related:
  - L3-07
  points:
  - point: 关键指标提炼
    not_raise: ''
    note: ''
    source_pids:
    - E019
    - E189
    raise: 未抓住核心产出效益，未按“结果导向、产出效益匹配”提炼与成本关联的关键指标；指标未围绕项目核心效益设置，多为定性描述
  - point: 指标聚焦
    not_raise: ''
    note: 依据沪财绩〔2024〕15号“高度关联、重点突出”原则
    source_pids:
    - E020
    - E190
    - E125
    - E126
    raise: 部分绩效指标未聚焦关键绩效指标；设置了常规性项目管理要求等与产出、效益、成本明显无关联的指标；关键产出、效益指标缺项，却堆砌大量评价类指标
  - point: 关键绩效指标与评价指标混淆
    not_raise: ''
    note: ''
    source_pids:
    - E187
    raise: 所设多为“及时率”“满意度”等评价类指标，而非与实施内容对应、与分项成本关联的关键绩效指标
  - point: 作业规范当作指标
    not_raise: ''
    note: 整改方向：删除作业标准类指标，按业务量补充数量指标，配置类指标改为质量指标
    source_pids:
    - E188
    raise: 直接把作业规范或管理要求写成指标，未提炼为可衡量的关键指标
  - point: 指标名称可衡量
    not_raise: 确难量化的指标可采用定性表述，但应具有可衡量性
    note: 依据 15 号文“量化易评”原则
    source_pids:
    - E027
    - E199
    - E127
    raise: 指标名称含“情况”“工作”等无法衡量的表述，或与实施内容不对应；指标未细化量化、缺少明确评价标准
  - point: 效益指标量化
    not_raise: ''
    note: ''
    source_pids:
    - E026
    - E198
    - E131
    raise: 效益指标仅定性描述（“提升”“改善”“优化”），无量化口径与目标值；具备条件的社会、生态效益未尽可能货币化；工程基建类和大型修缮购置类未明确当年及以后一段时期的预期效益
  - point: 指标类型与归类
    not_raise: 时效指标按项目实际设置，不要求一律设置
    note: 四类一级指标定义依据沪财绩〔2024〕15号
    source_pids:
    - E024
    - E197
    - E129
    - E130
    - E132
    raise: 成本、产出、效益、满意度指标归类错位（如把效益类指标填在产出数量栏）；产出指标的数量与质量未同时设置，或与主要支出方向不对应、存在重大缺项漏项；面向公众提供公共服务的项目未设置满意度指标
  - point: 满意度指标关联度
    not_raise: ''
    note: ''
    source_pids:
    - E196
    raise: 所设满意度指标考察难度大，且与项目核心绩效关联度不高
  - point: 增补指标须给出具体建议
    not_raise: ''
    note: 写法要求：指出“未设置/需增补某类指标”时，必须同时给出建议增设的具体指标名或口径，指标名从实施内容、核心目标、分项成本推导
    source_pids:
    - E193
    raise: ''
  - point: 购买服务项目的服务梳理与指标逻辑
    not_raise: ''
    note: 仅适用于购买服务项目
    source_pids:
    - E029
    - E202
    - E203
    raise: 购买服务项目未结合部门职责、政策要求、履职需求全面梳理服务对象、服务类型、服务内容，未明确项目功能定义；绩效指标未按“预期服务效益和满意度-预计产出”的逻辑确定
  brief: 是否提炼与成本关联的关键绩效指标：不以评价类、常规管理要求类、作业规范类指标充数；指标可衡量、归类正确，效益指标量化，公共服务项目设满意度指标。要求增补指标时须给出具体指标名。
- rule_id: R-BASE-BASIS
  tag: 基线值来源与测算
  level: L2
  question: 基线值是否有来源、测算底稿和论证过程，是否量化
  judgment_points: 标杆值需有取数和测算过程；实施量超设施总量需解释；标准不明确的指标应量化
  policy_anchor:
  - P8-T2-3-1-2
  - P15-1-1-3
  - P15-3-3
  origin: 政策+评审经验
  source_cases:
  - P001
  - P002
  - 典型问题汇总
  industries:
  - 交通设施养护
  - 考试考务
  valid_period: 2025-04-
  status: 待专家确认
  points:
  - point: 基线设定论证
    not_raise: ''
    note: 整改方向：补充历年实际值等历史统计数据和基线值出处
    source_pids:
    - E021
    - E191
    raise: 基线设定缺乏必要的论证过程，未补充基线值的具体出处（行业标准、历史标准、计划标准）；可对标的未与兄弟省市、国外或同行业做可比对标；受约束的未阐述约束条件（现行标准、总量限制、主管部门考核）
  - point: 基线合理性
    not_raise: ''
    note: 须先判断指标方向，见“标杆值方向”
    source_pids:
    - E022
    raise: 基线值明显低于实际值而未说明设定理由；未分析当前实际值与基线差距的问题与原因
  - point: 对标层次
    not_raise: ''
    note: ''
    source_pids:
    - E023
    raise: 未开展国内与国外、市级与区级、同行业同领域、当前与过往的多层次对标
  - point: 标杆值方向
    not_raise: 正向指标标杆值不低于实际值、逆向指标标杆值不高于实际值，属目标从严，不作质疑；逆向指标取最小值（如安全事故发生数为 0）属最严设定，不得写“目标偏宽松”
    note: 见到标杆值与实际值有差距不能直接质疑，先判断指标方向；意见中写差距与方向即可，不必写“正向/逆向”字样
    source_pids:
    - E135
    - E136
    - E137
    - E194
    - E195
    raise: 正向指标（越大越好，如合格率、及时率、覆盖率）标杆值远低于实际值；逆向指标（越小越好，如投诉率、事故数、整改时限、单位成本）标杆值远高于实际值；多个指标目标值设为“1个及以上”等，目标矮化
  - point: 产出数量指标的取值形式
    not_raise: 主动开展类事项（工作量可自主决定，如演练、检测、培训、采购数量）设定绝对值属正常
    note: 整改方向：被动接受类改为相对值，如“投诉办理率”“应急响应及时率”
    source_pids:
    - E133
    - E134
    - E192
    raise: 被动接受类事项（应急响应、处理投诉、案件受理、来访接待等，工作量由外部事件驱动、不可自主决定）设定了绝对次数作为基线
  - point: 基线差异化设定
    not_raise: ''
    note: ''
    source_pids:
    - E274
    raise: 配置类标准或基线未结合人口密度、服务对象结构等关键因素差异化设定，合理性论证不足
  brief: 基线值是否有出处和论证（行业、历史、计划标准，可比对标或约束条件）；差距未分析的提出。被动接受类事项设绝对次数的提出。不提：正向指标标杆值不低于实际值、逆向指标不高于实际值、逆向指标取 0，均属从严。
- rule_id: R-PROC-FLOW
  tag: 业务流程分类梳理
  level: L4
  question: 业务流程是否按业务类型分类梳理，是否识别影响成本的环节
  judgment_points: 按组织方式、能否主动管理频次/场次分类；流程与成本对应；优化空间具体
  policy_anchor:
  - P8-T2-3-2-1
  - P8-7
  origin: 政策+评审经验
  source_cases:
  - P002
  - 典型问题汇总
  industries:
  - 考试考务
  valid_period: 2025-04-
  status: 待专家确认
  points:
  - point: 业务流程梳理
    not_raise: ''
    note: ''
    source_pids:
    - E033
    - E204
    - E205
    raise: 作业流程或管理流程不清晰，未结合实施内容再梳理，未确定可改进的具体环节；梳理的是“政策制定—采购—实施”等项目管理流程，而非业务作业流程；只罗列费用科目，未梳理业务环节及其资源消耗
  - point: 作业模式比较
    not_raise: ''
    note: ''
    source_pids:
    - E209
    raise: 未比较完全自营、部分外包、全流程购买服务等作业模式的优劣势、成本差异及适用条件
  - point: 流程分析的呈现
    not_raise: 未绘制业务流程图或工作结构分解属呈现形式瑕疵，不作重点提示，除非其缺失导致业务流程分析无法实质开展
    note: ''
    source_pids:
    - E039
    raise: 未填列业务流程成本分析表、业务流程优化表（实质性分析缺项）
  brief: 是否按实施内容梳理业务作业流程（而非项目管理流程），是否梳理各环节的资源消耗，是否比较不同作业模式，是否填列业务流程成本分析表和优化表。不提：仅未绘制流程图。
- rule_id: R-PROC-PURCHASE
  tag: 采购、合同与服务考核
  level: L2
  question: 涉及政府采购/购买服务的项目，是否分析采购管理、合同管理、服务考核
  judgment_points: 招标需求、合同关键约定及执行、验收条件、考核结果与付款挂钩、供应商管控
  policy_anchor:
  - P32-R-3-2
  - P44-2-4
  - P32-1-2-5
  origin: 政策
  source_cases:
  - P001
  - P002
  - 典型问题汇总
  industries:
  - 交通设施养护
  - 考试考务
  valid_period: 2025-08-
  status: 待专家确认
  points:
  - point: 政府采购与内控
    not_raise: ''
    note: 组织管理情况部分的审核点，按政府采购、合同管理、履约验收三环节检查
    source_pids:
    - E040
    - E219
    - E223
    raise: 未明确购买服务需求内容；未说明采购方式是否合规、是否存在达到政府采购限额未履行政府采购程序；内控制度未建立
  - point: 合同管理
    not_raise: ''
    note: ''
    source_pids:
    - E041
    - E220
    raise: 未说明合同的具体内容与相关条款；支出审核不严格；未体现按效付费导向
  - point: 履约验收与按效付费
    not_raise: ''
    note: ''
    source_pids:
    - E042
    - E221
    - E222
    raise: 未说明是否进行考核验收、是否按效付费；服务台账不完备；服务监管和考核验收不到位；考核结果未与资金支付挂钩
  brief: 涉及采购或购买服务的，是否说明需求内容、采购方式与程序合规性、内控制度；合同内容与条款、支出审核、按效付费；考核验收、服务台账、考核结果与资金支付挂钩。
- rule_id: R-PROC-COST-LINK
  tag: 流程分析与成本衔接
  level: L3
  question: 流程分析与成本核算是否衔接，新技术应用是否匡算成本差异
  judgment_points: 流程优化对投入资源和成本的影响应量化；建议需有数据支撑
  policy_anchor:
  - P8-T2-3-2-2
  origin: 政策+评审经验
  source_cases:
  - P001
  - 典型问题汇总
  industries:
  - 交通设施养护
  valid_period: 2025-04-
  status: 待专家确认
  points:
  - point: 流程细化至末端并与成本挂钩
    not_raise: ''
    note: ''
    source_pids:
    - E034
    - E206
    raise: 流程未细化至业务末端节点，末级节点未与成本挂钩
  - point: 流程改进的成本效益
    not_raise: ''
    note: ''
    source_pids:
    - E037
    - E210
    raise: 未按点列示精简优化环节，未说明对效益、投入资源（人、财、物）和成本的影响；优化建议未基于成本效益比较；新技术、新工艺应用未分析其相较传统做法的成本效益
  brief: 流程是否细化到业务末端节点并与成本挂钩；流程改进是否按点列示环节，并说明对效益、人财物投入和成本的影响；新技术、新工艺是否分析成本效益。
- rule_id: R-COST-OPEN
  tag: 成本打开至末端
  level: L2
  question: 成本是否打开至末端（单价×数量）
  judgment_points: 委托服务费等按类别合并列示的需拆分到各项内容的单价与数量
  policy_anchor:
  - P8-T2-3-3-1
  - P8-T2-3-3-2
  origin: 政策+评审经验
  source_cases:
  - P002
  - 典型问题汇总
  industries:
  - 考试考务
  valid_period: 2025-04-
  status: 待专家确认
  points:
  - point: 成本打开至“单价×数量”
    not_raise: 未用饼图、环形图等反映成本数据特点属呈现形式瑕疵，不作重点提示，除非其缺失导致成本核算分析无法实质开展
    note: ''
    source_pids:
    - E044
    - E048
    - E224
    raise: 未细化项目成本主要构成；成本未分解至“单价×数量”层级，以项目总价充当单价、数量填列 1；未结合细化的历史成本数据打开相关成本；人工、耗材未打开资质与单价
  - point: 核算方法与核算过程
    not_raise: ''
    note: ''
    source_pids:
    - E051
    - E053
    - E059
    - E238
    raise: 未说明数据修正的具体方法（最低成本法、作业成本法等）与选用理由；未按优化前、优化后分别核算分项与总成本，未形成成本核算（估算）分析表；成本核定结论抽象（只写“经核定成本为X”），未说明核定动作与依据，成本项与业务流程环节无对应
  brief: 成本是否打开至“单价×数量”，是否存在以总价充当单价、数量填 1；是否说明核算方法与选用理由，是否分优化前后核算并形成核算表，核定是否落到具体动作和流程环节。不提：仅未用图表呈现。
- rule_id: R-COST-ATTRIB
  tag: 成本归集口径
  level: L4
  question: 成本归集口径是否合理、是否属于本项目开支范围
  judgment_points: 区分项目内/外开支；口径在各表之间保持一致；避免重复计列或漏列
  policy_anchor:
