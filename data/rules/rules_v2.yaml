  - point: 必须通过购买服务完成的论证
    not_raise: ''
    note: ''
    source_pids:
    - E032
    - E215
    - E216
    raise: 未结合本部门单位岗位设置、人员编制与履职要求说明本项目必须通过购买服务完成；涉及多项服务内容时只整体论证，未逐项论证购买必要性
  - point: 购买服务分类管控
    not_raise: ''
    note: 依据沪财预〔2025〕44号分类管控要求
    source_pids:
    - E119
    - E120
    - E121
    - E122
    - E123
    - E124
    raise: 存量购买服务项目除必须增加的成本类开支外金额增加而未说明；新增公共服务类、管理辅助类、信息技术类、工程管理类购买服务未说明按规定履行的审议或前置审核程序
  brief: 购买服务项目是否结合上级政策和部门职责论证立项必要性；是否说明在指导性目录内、不属负面清单及决策过程；是否结合岗位编制论证须通过购买服务完成，多项服务是否逐项论证；是否符合分类管控要求。
- rule_id: R-POL-SHARE
