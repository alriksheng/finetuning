- rule_id: R-REDUCE-VIS
  tag: 降本显著性
  level: L3
  question: 降本是否显著
  judgment_points: 意见模板口径：降本率大于等于5%小于10%为显示度不足；大于0小于5%为明显不足；未降本；须逐项说明降本路径
  policy_anchor:
  - P8-T2-4-1
  origin: 评审经验（意见模板）
  source_cases:
  - P002
  - P001
  industries:
  - 交通设施养护
  - 考试考务
  valid_period: 2025-04-
  status: 待专家确认
  points:
  - point: 降本显示度
    not_raise: 实际降本率不低于 10% 属达标，不写入意见正文，可转而提出“加强结果应用、将分析结果用于以后年度预算编制”的方向性建议
    note: 专家原文中两档名称写反，已按用户确认（2026-10-27）更正为：0~5% 严重不足、5%~10% 不足
    source_pids:
    - E089
    - E094
    - E095
    - E096
    - E097
    - E098
    - E090
    raise: 实际降本率小于 0（成本不降反增）、等于 0（未降本）、大于 0 且不超过 5%（严重不足）、大于 5% 且小于 10%（不足）；未进一步挖掘降本空间
  - point: 降本档位的写法
    not_raise: 降本率不低于 10% 属达标，不写入意见正文
    note: 写法要求：意见只写实际降本额、降本率和否定档位结论；档位阈值只作内部判定，不写入意见，也不要求报告补档位判定；降本率为负时应写“不降反增”，不得写成“未降本”
    source_pids:
    - E247
    - E253
    - E254
    raise: 降本率为负（成本不降反增）、为 0（未降本）或低于 10%（显示度不足）
  - point: 降本未落实到预算
    not_raise: ''
    note: 此时不应直接写“降本为 0”
    source_pids:
    - E255
    raise: 核定成本已低于预算，报告仍建议预算不调整，未将核定结果转为预算安排
  - point: 降本路径与全口径分析
    not_raise: ''
    note: ''
    source_pids:
    - E248
    raise: 未打开子项目成本构成、未合理设定综合费比例，导致降本点无从挖掘；未对全口径资金开展分析，降本增效路径不清晰，未提出具体可操作的降本建议
  brief: 降本是否显著：降本率为负、为 0、0~5%（严重不足）、5%~10%（不足）的提出，并写实际降本额和降本率；核定低于预算却未转为预算安排的提出；降本路径是否清晰。不提：降本率不低于 10%。
