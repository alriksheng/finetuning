    not_raise: ''
    note: ''
    source_pids:
    - E055
    - E084
    - E234
    raise: 把一次性支出（设备购置、开办费、改造、升级等）计入经常性成本或反之，未作区分；以某年度为基数测算未来预算时，未剔除该年度的大额非经常性项目
  brief: 成本基线是否考虑周期性（大小年），是否只以单一年度为基数；一次性支出与经常性支出是否区分，测算基数年度中的大额非经常性项目是否剔除。
- rule_id: R-COST-CHECK
  tag: 成本数据一致性
  level: L3
  question: 成本结论与报告内数据是否一致
  judgment_points: 文字与表格、摘要与正文、不同表之间的金额/比例/人数应一致；可复算的需复算
  policy_anchor: []
  origin: 评审经验
  source_cases:
  - P002
  - P001
  industries:
  - 交通设施养护
  - 考试考务
  valid_period: —
  status: 待专家确认
  points:
  - point: 表标题年度与结论年度
    not_raise: ''
    note: 属于数据和表述一致性问题，并入成本数据一致性
    source_pids:
    - E178
    raise: 测算表标题年度与结论年度不一致；或测算对象不是下一年度（当年度预算是现成的，不构成测算成果）
  - point: 表内验算
    not_raise: 注明“四舍五入尾差”的差额不作问题；均值、对标值能按某种口径还原的，注明口径即可，全部无法还原才提出
    note: 具体验算方法与容差见 PROGRAM 条目，由程序执行
    source_pids:
    - E064
    - E065
    - E066
    - E067
    - E068
    - E069
    - E070
    raise: 分项加总与小计、合计不符；单价×数量（或费率×基数）与总价不符；占比回算不符或占比合计不为100%；增长率计算有误；量纲或口径换算有误（如单价按年、数量按月）
  - point: 跨处一致性
    not_raise: 口径不同（预算配置、实际使用、标准配置、合同数等）且有说明的不作问题
    note: 检查范围必须覆盖附件与附表
    source_pids:
    - E071
    - E072
    - E073
    - E074
    - E075
    - E076
    - E077
    - E078
    raise: 正文、表格、脚注三方数据不一致；正文核减额未在附件中落地；同一成本项在不同表或附件中口径、数值不一致；汇总表与分项明细表不一致；正文所述计数与明细加总不一致；人、车、设备等资源数量在同一口径下跨表不一致；修订稿只改了一部分；附件、附表数据与正文不闭合
  - point: 口径与基数
    not_raise: 同名多值分属不同平台、口径或年度的，不得判为“同一项前后不一致”；口径差异有说明的排除
    note: 比对前先确认口径
    source_pids:
    - E079
    - E080
    - E081
    - E082
    - E086
    raise: 同名成本项存在多个数值且未说明各自的平台、口径或年度归属；核定值与历史成本或实际费用存在差异而未说明；账面成本与核定成本之间的大额差额无调节说明；未按脚注或表注定义的口径计算
  - point: 重复计列与已取消条目
    not_raise: 仅在两处并列呈现、未进入同一合计的，属呈现层重复，只提一条，不按金额重复计列处理
    note: ''
    source_pids:
    - E083
    - E085
    raise: 同一支出在两处计入同一合计或测算基数（金额构成层重复计列）；已标明“不安排、取消、未纳入”的条目金额仍被计入合计
  - point: 勾稽差错的表述
    not_raise: ''
    note: 写法要求：同表多处小额不闭合合并为一条集合表述（如“表X等N处乘加不闭合，最大差X，建议逐项核对更正”），只有单笔大额差错才逐项展开两个口径的数值
    source_pids:
    - E232
    raise: 附件与正文数字矛盾、加总不闭合、单价×数量不等于总价等勾稽差错
  - point: 全文跨章口径一致
    not_raise: 封面与正文机构名称不一致等笔误级瑕疵不作为重点问题单独立项
    note: ''
    source_pids:
    - E143
    - E293
    - E144
    - E294
    raise: 同一事实（金额、口径、年度、数量）在不同章节或表格中口径不一致且影响结论；同一内容在报告不同章节重复列示且口径不一
  brief: 数据是否一致：表内加总、单价×数量、占比、增长率是否正确；正文、表格、附件、脚注是否一致，核减是否在附件落地，跨章口径是否一致。不提：注明尾差、口径不同且有说明、笔误级瑕疵。多处小额差错合并表述。
