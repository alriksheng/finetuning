    - E243
    - E257
    raise: 核减源于把支出挪至公用经费或其他项目（支出结构调整，“此减彼增”）；核减实质只是资金来源调整（换科目、换渠道），支出总量未减；把一次性项目竣工结算、审计审价差额当作降本；降本额中包含跨年度支付节点调整
  - point: 核减原因
    not_raise: ''
    note: ''
    source_pids:
    - E244
    raise: 核减源于工作量调减或工作内容调整而未说明，核减原因缺失
  - point: 降本计算基准
    not_raise: ''
    note: ''
    source_pids:
    - E245
    - E246
    raise: 降本结论是相对上一年度的回溯降本，无法用于下一年度预算安排；用“上年度预算金额×上上年度降本率”等不合逻辑的方式计算降本额
  brief: 降本是否同口径、按成本构成逐项说明；资金渠道或支出结构调整、客观工作量调减、一次性项目结算或审价差额、跨年度支付调整、回溯降本，均不得视作降本；核减原因缺失的提出。
- rule_id: R-SUGGEST-QUALITY
