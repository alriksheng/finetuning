  status: 已确认（用户 2026-10-27）
  points:
  - point: 立项依据
    not_raise: ''
    note: 现有 31 条规则中没有对应立项依据的规则，拟新增
    source_pids:
    - E010
    - E174
    raise: 未补充本项目立项文件，未阐明项目设立初衷及必要性；或未按中央、本市、本部门、本单位的顺序列示立项依据文件名称及内容；涉及财政资金规模、财政支出责任比例、对象数量范围的关键信息未说明来由
  - point: 立项依据时效性
    not_raise: ''
    note: 意见写法：事实先行、建议收尾，如“报告引用《X》等上位文件，未见本项目立项批复或年度工作要点，建议补充以明确立项初衷与必要性”
    source_pids:
    - E015
    - E180
    raise: 所引立项依据文件已过期或被新文件替代，或只有上位文件、缺本项目立项批复或年度工作要点，且未说明现行有效性
  - point: 立项依据内容错配
    not_raise: ''
    note: 逐行比对文件名与关键内容；只提示核实更正，不替报告定性或改写。删去原文中的具体案例
    source_pids:
    - E016
    - E179
    raise: 立项依据表中文件名与所列关键内容主题不相关
  - point: 依据方案到期对“三个标准”的影响
    not_raise: ''
    note: 原文位于“三个标准”部分，内容属立项依据
    source_pids:
    - E273
    raise: 项目所依据的顶层实施方案已到期，立项必要性存疑，据此设定的各项标准意义不大
  brief: 是否列示本项目立项文件并阐明设立初衷与必要性（按中央、本市、本部门、本单位顺序）；所引依据是否现行有效，是否缺本项目立项批复或年度工作要点；依据表文件名与关键内容是否对应。错配只提示核实，不代为定性。
- rule_id: R-BASIC-MGMT
  tag: 职责分工与业务管理
  level: L2
  question: 相关主体职责分工是否明确，供应商与采购、合同、验收等业务管理内容是否介绍完整
  judgment_points: 主体职责边界；供应商信息；涉及采购的需求内容、合同条款、验收与按效付费条件
  policy_anchor: []
  origin: 评审经验（专家智能体规则）
  source_cases: []
  industries: []
  valid_period: 2025-
  status: 已确认（用户 2026-10-27）
  points:
  - point: 职责分工
    not_raise: ''
    note: 现有规则中没有对应职责分工和业务管理的规则，拟新增
    source_pids:
    - E011
    raise: 缺乏相关主体职责分工的描述，未明确不同主体的职责边界
  - point: 业务管理内容
