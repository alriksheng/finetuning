    raise: 购买服务项目未围绕政府采购、合同管理、台账管理、考核验收提出问题建议；涉及采购的经常性项目未围绕政府采购、合同管理、考核验收提出建议
  - point: 建议须落到具体环节
    not_raise: ''
    note: ''
    source_pids:
    - E251
    - E252
    raise: 只写“厉行节约”“加强论证”“盘活存量资产”等原则性表述，未落到招标条款、合同文本、服务考核等具体管理环节；项目已严重滞后或预算执行异常，分析未提出根本性纠偏路径
  brief: 问题建议是否有问必答、具体可执行：是否落到具体环节、管理行为和责任主体，是否结合流程分析覆盖管理提升、流程再造、技术应用；涉及采购的是否围绕采购、合同、考核验收提出建议。
- rule_id: R-STD-LINK
  tag: “三个标准”衔接
  level: L3
  question: “三个标准”是否衔接并分场景形成，是否落实到下一年度预算建议
  judgment_points: 绩效基线与成本定额联动；按场景分级分类；形成下一年度预算安排建议
  policy_anchor:
  - P8-T2-4-3
  - P15-2-1
  origin: 政策+评审经验
  source_cases:
  - P001
  - P002
  - 典型问题汇总
  industries:
  - 交通设施养护
  - 考试考务
  valid_period: 2025-04-
  status: 待专家确认
  points:
  - point: 增效情况与最终绩效目标
    not_raise: ''
    note: ''
    source_pids:
    - E091
    raise: 未按绩效基线与成本基线梳理形成最终绩效目标表
  - point: 成本定额标准与资金安排建议
    not_raise: 并非所有项目都要求形成支出标准，须结合项目特点提出
    note: 术语按旧版口径；专家原文中“成本定额”的新含义（项目总成本）暂不采用
    source_pids:
    - E050
    - E092
    - E093
    raise: 未从单价、数量、总价方面阐述分项成本定额标准，未确定成本基线；资金安排建议未明确测算依据，未提出后续财政资金安排的具体建议；未说明本项目是否具备形成支出标准的条件；调整原有支出标准的，未对执行原标准和新标准进行 3 至 5 年预算安排测算比较
  - point: 增效情况量化
    not_raise: ''
    note: ''
    source_pids:
    - E250
    raise: 增效情况只作定性描述（如“实现了流程优化”），未结合人员配比、人均作业量等关键指标的变化说明
  - point: 绩效基线与成本联动
    not_raise: ''
    note: ''
    source_pids:
    - E264
    raise: 绩效基线未与分项成本关联，未形成联动体系
  - point: 单位成本
    not_raise: ''
    note: ''
    source_pids:
    - E267
    raise: 能够拆分形成单位产出或单位服务的项目，未明确单位成本，未按项目实际工作量测算下一年度预算
  - point: 支出标准的合理性与分级
    not_raise: ''
    note: ''
    source_pids:
    - E268
    - E269
    - E270
    raise: 支出标准无法覆盖核定的实际成本，或明显高于历史水平；未按对象类型、作业频次等业务特征分级分类设定，标准“一刀切”；未建立分档分级的单位成本标准，结果无法推广应用于同类项目
  - point: 分析结果应用于预算编制
    not_raise: ''
    note: 年份按“当前年份＋1”确定下一年度，不照搬原例年份
    source_pids:
    - E271
    - E272
    raise: 给出了预算调整建议，但未结合下一年度实施计划测算；将核减支出挪至其他项目，核定结果实际只是支出结构调整；未测算下一年度预算安排，或把当年度（预算已批复）的测算当作下一年度安排
  - point: 支出标准的两条边界
    not_raise: 不是所有项目都要求形成支出标准，须结合项目特点提出，不具备条件的只核是否说明了适用性与形成条件；支出标准可能只选取部分支出内容形成，“支出标准×数量”不一定等于核定成本，不得据此反推、勾稽或质疑核定成本
    note: 这两条在新旧口径下都成立，按专家意见并入
    source_pids:
    - E276
    - E277
    raise: ''
  brief: “三个标准”是否衔接并落实到下一年度预算：绩效基线与分项成本是否联动，可拆分的是否明确单位成本，标准是否分级分类、能否覆盖实际成本。不提：并非所有项目都须形成支出标准；不得以支出标准×数量反推核定成本。
