    - E233
    raise: 成本归集口径与合同约定或结算口径不一致，未说明跨年度、跨标段成本的分摊与归集方式
  - point: 成本归集与核定的对应
    not_raise: ''
    note: ''
    source_pids:
    - E230
    raise: 成本核算表备注与实际不符，面积计算或单价核定逻辑混乱、前后矛盾，成本归集与成本核定无法对应
  brief: 成本归集是否按成本动因区分可变与不变成本、人员经费与服务经费，核算范围是否明确，不合理无效内容是否剔除，归集口径与合同或结算口径是否一致，归集与核定是否对应。
- rule_id: R-COST-BENCH
  tag: 对标对象可比性
