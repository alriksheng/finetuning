CONDUCT:
- point: 条目必须有问题指向
  note: 成文纪律：每个编号条目、条内每个分句都要落到一个问题上；只罗列报告已有内容、无问题指向的条目无效。判据“数字-缺陷 1:1”：1 个数字加指向词为举证，2 个以上数字而无指向词为交代现状
  source_pids:
  - E183
- point: 段首不复述
  note: 成文纪律：段首第一句必须是判断或要求；报告已做的内容压到 30 字内、与判断同句；“已列”类词全篇不超过 2 处，“仅列X，无Y”属于判断句，不受此限
  source_pids:
  - E184
- point: 预算口径问题在基本情况部分提出
  note: 审核纪律：预算口径类缺陷必须在基本情况部分提出，不得留到“三个标准”部分才首次出现
  source_pids:
  - E185
- point: 基本情况各类要点逐条过一遍
  note: 审核纪律：立项依据、实施内容、预算管理、业务管理各类要点都要检查；不得因项目是购买服务就只写购买服务
  source_pids:
  - E186
- point: 成本指标问题写在成本核算分析部分
  note: 审核纪律：缺设成本指标、以预算倒推成本指标、成本指标标杆值偏高或占位等问题，一律在“成本核算分析部分”提出（成本指标在成本核算分析后确定）；绩效基线部分只审与成本直接关联的核心绩效指标（产出、质量、时效）及其基线依据
  source_pids:
  - E025
  - E128
  - E201
- point: 购买服务内容的归段
  note: 审核纪律：购买服务必要性论证写在“购买服务立项必要性论证部分”，采购、合同、验收写在“组织管理情况部分”，不在业务流程部分重复展开；业务流程部分只谈作业和管理流程本身
  source_pids:
  - E038
  - E208
- point: 不按固定维度机械列条
  note: 成文纪律：维度清单是检查口径，不是输出结构。条目数等于本项目实际问题数，一条即可；报告已做对的维度不单独成条；引用政策要落到本项目具体事实（哪个品目、哪类事项、哪次会议）。条目数恒定且每条恰好换一个维度，即属机械列条
  source_pids:
  - E217
  - E218
- point: 报告章节结构
  note: 结构纪律：经常性项目四段（基本情况、绩效基线分析、业务流程分析、成本核算分析）；购买服务项目六段（基本情况、购买服务立项必要性论证、绩效基线分析、组织管理情况、业务流程分析、成本核算分析）；政策类按六方面组织，不写降本增效和“三个标准”，分析结论写新设、调整、延续或退出及条款修订建议
  source_pids:
  - E008
  - E009
  - E278
- point: 降本增效与“三个标准”部分的写法
  note: 成文纪律：不写“不核减不予认可”“按降本显示度判定为”等判决式短语和判档逻辑；降本增效部分是总结，2 至 4 条、约 200 至 260 字，按“降本情况、增效情况（单列、非必写）、问题建议情况、涉及购买服务”顺序，不重述成本核算过程；“三个标准”部分只回指、不复述具体数字，2 至 4 条、约 130 至 160 字；整表须在一页内
  source_pids:
  - E256
  - E258
  - E259
  - E260
  - E275
- point: 只写真实存在的问题
  note: 审核纪律：审核要点是备选清单，不是必填项，只写该项目真实存在的问题；写每一部分前逐条过要点，确认存在才写，某一部分全部条目指向同一主题是漏项征兆
  source_pids:
  - E173
  - E283
  - E291
- point: 不臆造政策条款和报告事实
  note: 审核纪律：引用须来自政策原文，无法确认出处的改写为不依赖条款号的表述，不得编造条款号或留下占位符；对报告内容的指控须能在原文回查，查无实据的不写
  source_pids:
  - E138
  - E286
- point: 落笔前回查原文
  note: 审核纪律：数据存疑时核对附件后再落笔；写“未绘制、未填列、未列示”之前先确认原文确实没有，已补充的改写为“已……但仍未……”；缺项表述不加“（若有）”“如适用”等对冲词
  source_pids:
  - E139
  - E287
  - E292
- point: 区分合规性问题与完善性建议
  note: 审核纪律：触碰负面清单、采购程序、合同验收的属合规性问题，须显性提示；论证充分性、对标合理性属完善性建议
  source_pids:
  - E140
- point: 审核方立场
  note: 审核纪律：产出为审核意见，不代被审核方改写报告；以论证是否成立为标准，不因报告篇幅或机构名气降低核验强度
  source_pids:
  - E141
  - E142
- point: 建议可执行、有问必答
  note: 成文纪律：每条建议必须可执行、可核查（追问“部门读了这条要做什么”，答不上来即是套话）；建议与问题一一对应
  source_pids:
  - E284
  - E285
- point: 缺项类条目语序
  note: 成文纪律：事实先行、建议收尾，按“报告引用X，未见Y，建议补充Z”成文，不以建议动词开头再回补事实
  source_pids:
  - E289
- point: 笔误不占重点条位
  note: 成文纪律：笔误级瑕疵不作为重点条单独立项，有实质问题的并入末条一句带过
  source_pids:
  - E290
- point: 意见表结构与段落归位
  note: 结构纪律：政策类按六方面组织、分析结论写明确政策结论和可落地的条款修订建议，不写降本增效和“三个标准”；经常性项目四段、购买服务项目六段且使用专用要点；购买服务内容按段归位，同一事实只在一格展开；降本增效部分“增效”单列成条；整表一页以内
  source_pids:
  - E115
  - E116
  - E145
  - E295
  - E146
  - E147
  - E296
  - E297
- point: 不写评价性表扬
  note: 成文纪律：进步式（有所提升）、正确式（方向正确）、整体品质式（论证充分、较为完整、“成本已打开”等动作词加品质结论）一律删除；判别用三层测试（删掉后“但”是否仍成立、是否含对报告整体品质的价值判断、主语是动作还是品质）；事实陈述加转折、转述报告观点后否定、转述理由后要求补证、用中性动词描述修订稿变化，可以保留
  source_pids:
  - E148
  - E149
  - E150
  - E156
  - E157
  - E158
  - E159
  - E160
  - E161
  - E162
  - E163
  - E164
  - E165
  - E166
  - E167
  - E168
  - E169
  - E288
- point: 句子落点：数字-缺陷 1:1
  note: 成文纪律：1 个数字加紧跟的指向词（未说明、不一致、偏高、偏低、超、倒推）属举证，保留并与判断同句；2 个以上数字或“分别为、共N项”式列举且无指向词属交代现状，删到 1 个数字或改写成缺陷；不能用“删掉后判断是否仍成立”作判据，否则会把证据删光；段首第一句须是判断或要求
  source_pids:
  - E151
  - E152
  - E153
  - E154
  - E155
PROGRAM:
- point: 数据校验方法与参数
  note: 程序规则：表格加总前先识别合并单元格续行，续行不计入加总，也不判为空白；取数错误判严重、单价誊抄错（总价正确）判较大，不得“近似通过”，无法核验的写“未能核验（原因）”；容差：加总±0.05，占比±0.2个百分点，单价反算按单价精度×数量÷2
  source_pids:
  - E060
  - E061
  - E062
  - E063
TERM:
- point: “三个标准”新口径定义
  note: 新口径（2026-10-14 换代）：绩效基线＝与成本直接相关的核心绩效指标及指标值，一经确定一般不得随意调整；成本定额＝项目总成本，一般不得超定额安排预算，可拆分的应明确单位成本；支出标准＝由财政部门或会同主管部门按规定程序印发形成，作为预算编审上限，报告所提为建议、不等于已印发。用词不再是“公共服务绩效标准、成本定额标准”。只在新口径下成立的审核点：要求报告“形成支出标准”属主体错位；把成本定额写成“单价×工作量的固化件”。本期沿用旧版口径，暂不启用
  source_pids:
  - E105
  - E106
  - E107
  - E108
  - E261
  - E262
  - E263
  - E265
  - E266
- point: “三个标准”新口径的来源
  note: 《关于财政支出项目标准体系相关概念及其应用工作的思考研究》（局内研究，无文号），新口径来源；本期不启用
  source_pids:
  - E007
