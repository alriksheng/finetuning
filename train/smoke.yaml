# 冒烟测试：10 条样本、几十步，只验证 4 件事（方案 3.2 训练前检查 5、6）：
#   1) 对话模板渲染正确（看预处理日志里打印的 input_ids / inputs / label_ids）；
#   2) 损失正常下降；3) LoRA 能被 vLLM 加载且与框架内推理一致；4) 思考标记与推理时一致。
# 用法：llamafactory-cli train train/smoke.yaml
model_name_or_path: openbmb/MiniCPM-V-4_5
trust_remote_code: true
flash_attn: fa2
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all
dataset_dir: data/train
dataset: audit_train_think,rule_L3-07_train_think
template: minicpm_v
cutoff_len: 12288
max_samples: 10
overwrite_cache: true
preprocessing_num_workers: 2
train_on_prompt: false
output_dir: saves/minicpmv45/lora/smoke
logging_steps: 1
save_steps: 30
overwrite_output_dir: true
report_to: none
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
max_steps: 30
lr_scheduler_type: constant
bf16: true
gradient_checkpointing: true
seed: 42
